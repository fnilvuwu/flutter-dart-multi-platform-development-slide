<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesi 05 · What If: Tanpa Expanded?</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-red-500">What If</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Tanpa Expanded?</h1>
        <div className="mt-3 h-2 w-24 rounded bg-red-500"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-5">
          <div>
            <h3 className="text-base font-bold text-red-500 mb-1.5">Masalah: Layout Overflow</h3>
            <div className="bg-stone-900 rounded-xl p-3 text-[12px] leading-snug">
              <pre className="text-green-400">{`Row(
  children: [
    Container(width: 800),
    Container(width: 600),
  ],
)`}</pre>
            </div>
            <div className="mt-2 bg-red-50 border-2 border-red-300 rounded-xl p-3">
              <div className="flex gap-2">
                <div className="w-40 h-12 bg-red-400 rounded-lg flex items-center justify-center text-white text-sm">800px</div>
                <div className="w-32 h-12 bg-red-300 rounded-lg flex items-center justify-center text-white text-sm">600px</div>
              </div>
              <p className="mt-2 text-red-600 font-bold text-sm">⚠️ OVERFLOWED by 120px</p>
            </div>
          </div>
          <div>
            <h3 className="text-base font-bold text-green-600 mb-1.5">Solusi: Gunakan Expanded</h3>
            <div className="bg-stone-900 rounded-xl p-3 text-[12px] leading-snug">
              <pre className="text-green-400">{`Row(
  children: [
    Expanded(
      child: Container(),
    ),
    Expanded(
      child: Container(),
    ),
  ],
)`}</pre>
            </div>
            <div className="mt-2 bg-green-50 border-2 border-green-300 rounded-xl p-3">
              <div className="flex gap-2 h-12">
                <div className="flex-1 bg-green-400 rounded-lg flex items-center justify-center text-white text-sm">Flex 1</div>
                <div className="flex-1 bg-green-300 rounded-lg flex items-center justify-center text-white text-sm">Flex 1</div>
              </div>
              <p className="mt-2 text-green-600 font-bold text-sm">✅ Widget mengisi ruang tersedia</p>
            </div>
          </div>
        </div>
        <div className="mt-3 bg-amber-50 border-l-4 border-amber-400 rounded-r-lg p-3">
          <p className="text-stone-700 text-sm"><span className="font-bold">Tips:</span> Expanded hanya bisa digunakan di dalam Row, Column, atau Flex. Di luar itu akan error!</p>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-4 pt-2 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Tunjukkan error overflow secara langsung di emulator. Buat mahasiswa melihat masalah sebelum diberi solusi.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
