<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 · What If: Switch tanpa Break</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">What If</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Switch tanpa Break → Fallthrough</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6">
          <div className="flex-1 min-w-0">
            <div className="rounded-2xl bg-[#1e1e2e] p-4 shadow-xl mb-3">
              <div className="flex items-center gap-2 mb-2">
                <div className="w-3 h-3 rounded-full bg-red-500"></div>
                <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div className="w-3 h-3 rounded-full bg-green-500"></div>
                <span className="ml-2 text-xs text-slate-400 font-mono">fallthrough.dart</span>
              </div>
              <pre className="text-xs text-[#cdd6f4] font-mono leading-snug overflow-x-auto"><code>{`void main() {
  int nilai = 85;

  switch (nilai) {
    case 100:
      print('Sempurna');
      // tidak ada break!
    case 85:
      print('Sangat Baik');
      // tidak ada break!
    case 70:
      print('Baik');
      // tidak ada break!
    default:
      print('Default');
  }
}`}</code></pre>
            </div>
            <div className="rounded-xl bg-red-50 border border-red-200 p-3">
              <p className="text-sm text-red-700 font-mono">Output: Sangat Baik / Baik / Default</p>
              <p className="text-xs text-red-600 mt-1">⚠️ Semua case setelah match dijalankan!</p>
            </div>
          </div>
          <div className="flex-1 min-w-0 space-y-2.5">
            <div className="rounded-xl bg-red-50 border-2 border-red-200 p-4">
              <h3 className="font-bold text-red-700 text-base mb-1">⚠️ Fallthrough</h3>
              <p className="text-sm text-slate-700 leading-relaxed">Tanpa <code className="bg-red-100 px-1 rounded font-mono">break</code>, eksekusi akan "jatuh" ke case berikutnya. Ini disebut <strong>fallthrough</strong>.</p>
            </div>
            <div className="rounded-xl bg-accent-soft border-2 border-accent/20 p-4">
              <h3 className="font-bold text-accent text-base mb-1">📌 Kapan Fallthrough Berguna?</h3>
              <p className="text-sm text-slate-700 leading-relaxed">Kadang kita sengaja menginginkan fallthrough, misalnya untuk menangani beberapa case dengan satu blok kode (seperti di slide sebelumnya).</p>
            </div>
            <div className="rounded-xl bg-green-50 border-2 border-green-200 p-4">
              <h3 className="font-bold text-green-700 text-base mb-1">✅ Best Practice</h3>
              <p className="text-sm text-slate-700 leading-relaxed">Selalu akhiri case dengan <code className="bg-green-100 px-1 rounded font-mono">break</code> kecuali kamu sengaja menginginkan fallthrough. Gunakan komentar <code className="bg-green-100 px-1 rounded font-mono">// fallthrough</code> jika memang diinginkan.</p>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Fallthrough bisa jadi bug tersembunyi. Tunjukkan output yang tidak diharapkan dan bagaimana menambahkan break memperbaikinya.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
