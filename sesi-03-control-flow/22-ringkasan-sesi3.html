<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22 · Ringkasan Sesi 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Ringkasan</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Sesi 3: Control Flow & Functions</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-4">
          <div className="rounded-2xl bg-accent-soft p-4 border border-accent/20">
            <h3 className="font-bold text-accent text-base mb-2">🔀 Conditional</h3>
            <ul className="text-sm text-slate-700 space-y-1">
              <li>• <code className="bg-accent/10 px-1 rounded font-mono">if</code> — cek satu kondisi</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">else if</code> — cek beberapa kondisi</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">else</code> — fallback default</li>
              <li>• Urutan evaluasi: atas ke bawah</li>
            </ul>
          </div>
          <div className="rounded-2xl bg-accent-soft p-4 border border-accent/20">
            <h3 className="font-bold text-accent text-base mb-2">🔄 Switch Case</h3>
            <ul className="text-sm text-slate-700 space-y-1">
              <li>• Cocok untuk banyak nilai konstan</li>
              <li>• Gunakan <code className="bg-accent/10 px-1.5 rounded font-mono">break</code> setiap case</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">default</code> untuk fallback</li>
              <li>• Case stacking tanpa break</li>
            </ul>
          </div>
          <div className="rounded-2xl bg-accent-soft p-4 border border-accent/20">
            <h3 className="font-bold text-accent text-base mb-2">🔁 Loop</h3>
            <ul className="text-sm text-slate-700 space-y-1">
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">for</code> — jumlah iterasi diketahui</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">while</code> — cek kondisi dulu</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">do-while</code> — body jalan dulu</li>
              <li>• Hindari infinite loop!</li>
            </ul>
          </div>
          <div className="rounded-2xl bg-accent-soft p-4 border border-accent/20">
            <h3 className="font-bold text-accent text-base mb-2">⚡ Function</h3>
            <ul className="text-sm text-slate-700 space-y-1">
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">void</code> — tidak return nilai</li>
              <li>• <code className="bg-accent/10 px-1.5 rounded font-mono">return</code> — kembalikan nilai</li>
              <li>• Parameter — input fungsi</li>
              <li>• Reusability & modularitas</li>
            </ul>
          </div>
        </div>
        <div className="mt-3 rounded-xl bg-gradient-to-r from-accent to-accent-strong p-4 text-white">
          <h3 className="font-bold text-base mb-1.5">🎯 Key Takeaways</h3>
          <div className="grid grid-cols-3 gap-4 text-sm">
            <div className="flex items-center gap-2">
              <span className="text-2xl">✅</span>
              <span>Control flow = arah program</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-2xl">✅</span>
              <span>Function = kode reusable</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-2xl">✅</span>
              <span>Selalu handle semua kondisi</span>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Sesi berikutnya akan membahas collections (List, Set, Map) dan OOP basics. Pastikan siswa sudah memahami control flow dan function dengan baik.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
