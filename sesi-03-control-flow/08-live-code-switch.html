<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 · Live Code: Day of Week</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [selectedDay, setSelectedDay] = useState('Senin');
  const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
  const getDayType = (day) => {
    switch (day) {
      case 'Senin': case 'Selasa': case 'Rabu': case 'Kamis': case 'Jumat':
        return { text: 'Hari Kerja 📚', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-200' };
      case 'Sabtu': case 'Minggu':
        return { text: 'Hari Libur 🎉', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-200' };
      default:
        return { text: 'Tidak Valid', color: 'text-gray-600', bg: 'bg-gray-50', border: 'border-gray-200' };
    }
  };
  const result = getDayType(selectedDay);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Live Code</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">Day of Week</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-4 flex-1 px-14" data-stagger>
        <div className="flex gap-6">
          <div className="flex-1 min-w-0">
            <div className="rounded-2xl bg-[#1e1e2e] p-4 shadow-xl">
              <div className="flex items-center gap-2 mb-2">
                <div className="w-3 h-3 rounded-full bg-red-500"></div>
                <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div className="w-3 h-3 rounded-full bg-green-500"></div>
                <span className="ml-2 text-xs text-slate-400 font-mono">day_of_week.dart</span>
              </div>
              <pre className="text-xs text-[#cdd6f4] font-mono leading-snug overflow-x-auto"><code>{`void main() {
  String hari = '${selectedDay}';

  switch (hari) {
    case 'Senin':
    case 'Selasa':
    case 'Rabu':
    case 'Kamis':
    case 'Jumat':
      print('Hari Kerja');
      break;
    case 'Sabtu':
    case 'Minggu':
      print('Hari Libur');
      break;
    default:
      print('Tidak Valid');
  }
}`}</code></pre>
            </div>
          </div>
          <div className="flex-1 min-w-0 flex flex-col justify-center">
            <div className="rounded-2xl border-2 border-slate-200 p-4 bg-slate-50">
              <h3 className="text-base font-bold text-slate-700 mb-2">🎛️ Pilih Hari</h3>
              <div className="grid grid-cols-7 gap-1.5 mb-3">
                {days.map(day => (
                  <button key={day} onClick={() => setSelectedDay(day)} className={`rounded-lg px-3 py-2 text-sm font-bold transition-all ${selectedDay === day ? 'bg-accent text-white shadow-lg scale-105' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`}>
                    {day.substring(0, 3)}
                  </button>
                ))}
              </div>
              <div className={`rounded-xl p-3 border-2 ${result.bg} ${result.border}`}>
                <p className={`font-bold text-base ${result.color}`}>{result.text}</p>
              </div>
            </div>
            <div className="mt-2.5 rounded-xl bg-accent/5 border border-accent/20 p-3">
              <p className="text-sm text-slate-600">💡 Perhatikan bagaimana <strong>case bertumpuk</strong> (Senin s/d Jumat) tanpa break di antara mereka — semua dieksekusi ke blok yang sama.</p>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Demo interaktif ini menunjukkan case stacking — beberapa case bisa ditumpuk tanpa break untuk menangani beberapa nilai dengan satu blok kode.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
