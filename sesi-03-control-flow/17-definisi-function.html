<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 · Definisi: void, return, parameter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Definisi</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">void, return, parameter</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6">
          <div className="flex-1 min-w-0 space-y-3">
            <div className="rounded-xl bg-accent-soft p-4 border border-accent/20">
              <h3 className="font-bold text-accent text-base mb-1">📌 void</h3>
              <p className="text-sm text-slate-700">Fungsi yang <strong>tidak mengembalikan</strong> nilai. Hanya menjalankan kode.</p>
              <code className="block bg-[#1e1e2e] text-[#cdd6f4] p-2 rounded-lg text-xs font-mono mt-2">void sapa() {'{ print("Halo!"); }'}</code>
            </div>
            <div className="rounded-xl bg-accent-soft p-4 border border-accent/20">
              <h3 className="font-bold text-accent text-base mb-1">📌 return</h3>
              <p className="text-sm text-slate-700">Fungsi yang <strong>mengembalikan</strong> nilai. Harus ada tipe data.</p>
              <code className="block bg-[#1e1e2e] text-[#cdd6f4] p-2 rounded-lg text-xs font-mono mt-2">int tambah(a, b) {'{ return a + b; }'}</code>
            </div>
            <div className="rounded-xl bg-accent-soft p-4 border border-accent/20">
              <h3 className="font-bold text-accent text-base mb-1">📌 Parameter</h3>
              <p className="text-sm text-slate-700">Input yang diterima fungsi. Bisa lebih dari satu.</p>
              <code className="block bg-[#1e1e2e] text-[#cdd6f4] p-2 rounded-lg text-xs font-mono mt-2">String sapa(String nama) {'{...}'}</code>
            </div>
          </div>
          <div className="flex-1 min-w-0">
            <div className="rounded-2xl bg-[#1e1e2e] p-4 shadow-xl">
              <div className="flex items-center gap-2 mb-2">
                <div className="w-3 h-3 rounded-full bg-red-500"></div>
                <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div className="w-3 h-3 rounded-full bg-green-500"></div>
                <span className="ml-2 text-xs text-slate-400 font-mono">functions.dart</span>
              </div>
              <pre className="text-xs text-[#cdd6f4] font-mono leading-snug overflow-x-auto"><code>{`// void: tidak return
void sapa(String nama) {
  print('Halo, \$nama!');
}
// return: mengembalikan nilai
int tambah(int a, int b) {
  return a + b;
}
// multiple parameters
String buatNama(String depan, String belakang) {
  return '\$depan \$belakang';
}
void main() {
  sapa('Budi');
  int hasil = tambah(5, 3);
  print(hasil); // 8
  String n = buatNama('John', 'Doe');
  print(n); // John Doe
}`}</code></pre>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Jelaskan bahwa return mengakhiri eksekusi fungsi. Setelah return, tidak ada kode yang dijalankan. Untuk void, kita bisa return tanpa nilai untuk keluar lebih awal.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
