<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesi 9 · What If</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [reveal, setReveal] = useState([false, false, false]);
  const toggleReveal = (i) => setReveal(prev => { const n = [...prev]; n[i] = !n[i]; return n; });
  const scenarios = [
    { q: 'What If: Data hilang setelah restart?', icon: '💾', color: 'red', impact: 'Data hanya ada di RAM, hilang saat app ditutup. User harus input ulang dari awal.', fix: 'Gunakan SharedPreferences/SQLite/File untuk persistensi data.' },
    { q: 'What If: Database corrupt?', icon: '🗄️', color: 'amber', impact: 'Data tidak bisa dibaca, query error, aplikasi crash. Seluruh data user bisa hilang.', fix: 'Backup database secara berkali. Gunakan try-catch untuk error handling.' },
    { q: 'What If: JSON format salah?', icon: '📄', color: 'purple', impact: 'FormatException terjadi, parsing gagal, aplikasi crash jika tidak dihandle.', fix: 'Selalu gunakan try-catch saat json.decode(). Validasi format sebelum parse.' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Sesi 9 · Slide 14</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">What If — Skenario Storage</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-6 flex-1 px-14" data-stagger>
        <div className="space-y-4">
          {scenarios.map((s, i) => (
            <div key={i} className={`rounded-xl border-2 ${reveal[i] ? `border-${s.color}-400 bg-${s.color}-50` : 'border-stone-200 bg-stone-50'} p-5 cursor-pointer transition-all`} onClick={() => toggleReveal(i)}>
              <div className="flex items-center gap-4">
                <span className="text-2xl">{s.icon}</span>
                <div className="flex-1">
                  <h4 className="font-bold text-ink">{s.q}</h4>
                  {reveal[i] && (
                    <div className="mt-3 animate-pop">
                      <p className="text-sm text-stone-600 mb-2"><span className="font-bold text-red-600">Dampak:</span> {s.impact}</p>
                      <p className="text-sm text-green-700"><span className="font-bold">Solusi:</span> {s.fix}</p>
                    </div>
                  )}
                </div>
                <span className="text-stone-400 font-bold">{reveal[i] ? '−' : '+'}</span>
              </div>
            </div>
          ))}
        </div>
      </main>
      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Klik setiap skenario untuk reveal. Diskusikan pentingnya error handling dalam storage.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
