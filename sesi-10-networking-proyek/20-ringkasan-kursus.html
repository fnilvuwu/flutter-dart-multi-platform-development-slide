<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesi 10 · Ringkasan Kursus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const sessions = [
    { icon: '📱', title: 'Session 1-3', desc: 'Widget Dasar, Layout, & Navigation', color: 'bg-blue-100 border-blue-300' },
    { icon: '🎨', title: 'Session 4-5', desc: 'Styling, Animation & Custom Widget', color: 'bg-purple-100 border-purple-300' },
    { icon: '📋', title: 'Session 6-7', desc: 'State Management & List View', color: 'bg-green-100 border-green-300' },
    { icon: '📝', title: 'Session 8', desc: 'Input & Form (Validasi, Buttons)', color: 'bg-amber-100 border-amber-300' },
    { icon: '💾', title: 'Session 9', desc: 'Data Storage (SQLite, SharedPrefs)', color: 'bg-red-100 border-red-300' },
    { icon: '🌐', title: 'Session 10', desc: 'Networking & Mini Project', color: 'bg-cyan-100 border-cyan-300' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Sesi 10 · Slide 20</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Ringkasan Kursus Lengkap</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {sessions.map((s, i) => (
            <div key={i} className={`rounded-xl p-2.5 border-2 ${s.color} hover:scale-105 transition-transform`}>
              <div className="text-2xl mb-2">{s.icon}</div>
              <h4 className="font-bold text-ink text-sm">{s.title}</h4>
              <p className="text-xs text-stone-600 mt-1">{s.desc}</p>
            </div>
          ))}
        </div>
        <div className="bg-gradient-to-r from-accent to-accent-strong rounded-xl p-3 text-white">
          <h3 className="text-xl font-bold mb-3">Perjalanan Belajar Flutter</h3>
          <div className="grid grid-cols-3 gap-3 text-sm">
            <div>
              <p className="font-bold mb-1">Yang Dipelajari:</p>
              <p className="text-white/80">• Widget & Layout</p>
              <p className="text-white/80">• Navigation & State</p>
              <p className="text-white/80">• Form & Input</p>
            </div>
            <div>
              <p className="font-bold mb-1">Skill yang Didapat:</p>
              <p className="text-white/80">• Membangun UI kompleks</p>
              <p className="text-white/80">• Mengelola state & data</p>
              <p className="text-white/80">• Integrasi API & storage</p>
            </div>
            <div>
              <p className="font-bold mb-1">Langkah Selanjutnya:</p>
              <p className="text-white/80">• State management (Riverpod/Bloc)</p>
              <p className="text-white/80">• Firebase integration</p>
              <p className="text-white/80">• Publish ke Play Store</p>
            </div>
          </div>
        </div>
        <div className="mt-4 text-center">
          <p className="text-base font-bold text-accent">Selamat menyelesaikan Kursus Pemrograman Mobile Flutter!</p>
          <p className="text-sm text-stone-500">Terus berlatih dan bangun project-project keren!</p>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-4 pt-2 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Penutupan kursus! Berikan motivasi dan arahan next steps. Bagikan resource lanjutan untuk self-learning.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
