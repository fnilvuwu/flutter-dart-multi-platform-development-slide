<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showResult, setShowResult] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-[#E32428]/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-[#E32428] rotate-45 opacity-15 animate-float"></div>

      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-[#E32428]">What If?</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Bagaimana jika tanpa cross-platform?</h1>
        <div className="mt-3 h-2 w-24 rounded bg-[#E32428]"></div>
      </header>

      <main className="relative z-10 mt-4 flex-1 px-14" data-stagger>
        <div className="flex gap-6">
          <div className="flex-1 min-w-0">
            <div className="rounded-2xl bg-red-50 border-2 border-[#E32428] p-4 mb-3">
              <h3 className="font-extrabold text-[#E32428] text-lg mb-2">Skenario: Aplikasi To-Do List</h3>
              <p className="text-base text-slate-700 mb-2">Jika ingin membuat aplikasi untuk Android DAN iOS tanpa Flutter:</p>
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-xl bg-white p-3 border border-stone-200">
                  <p className="font-bold text-[#25D366] text-sm">📱 Android</p>
                  <p className="text-[15px] text-slate-600">Kotlin + Android Studio</p>
                  <p className="text-[14px] text-stone-400">~10.000 baris kode</p>
                </div>
                <div className="rounded-xl bg-white p-3 border border-stone-200">
                  <p className="font-bold text-[#E32428] text-sm">🍎 iOS</p>
                  <p className="text-[15px] text-slate-600">Swift + Xcode</p>
                  <p className="text-[14px] text-stone-400">~10.000 baris kode</p>
                </div>
              </div>
            </div>

            <button onClick={() => setShowResult(!showResult)}
              className="rounded-full bg-[#E32428] px-6 py-2 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
              {showResult ? 'Sembunyikan' : 'Lihat Dampaknya'}
            </button>

            <div className="mt-3 min-h-[168px]">
              {showResult ? (
                <div className="rounded-2xl bg-ink p-4 text-white animate-pop">
                  <h4 className="font-bold text-[#25D366] mb-2">Dampak:</h4>
                  <div className="grid grid-cols-2 gap-2 text-[15px]">
                    <div className="rounded-lg bg-white/5 p-2.5">⏰ Waktu: <b className="font-bold text-red-400">2x lebih lama</b></div>
                    <div className="rounded-lg bg-white/5 p-2.5">💰 Biaya: <b className="font-bold text-red-400">2x lipat</b></div>
                    <div className="rounded-lg bg-white/5 p-2.5">🐛 Bug: <b className="font-bold text-red-400">2x lipat</b></div>
                    <div className="rounded-lg bg-white/5 p-2.5">🔄 Update: <b className="font-bold text-red-400">2 kali</b></div>
                  </div>
                </div>
              ) : null}
            </div>
          </div>

          <div className="w-72 flex-none flex flex-col gap-3">
            <div className="rounded-3xl bg-[#25D366]/10 p-4 border-l-8 border-[#25D366]">
              <h4 className="font-bold text-[#25D366] text-lg mb-1">Dengan Flutter</h4>
              <p className="text-[15px] text-slate-700">Satu kode → Android + iOS</p>
              <p className="text-[13px] text-stone-400 mt-1">~10.000 baris kode saja</p>
            </div>
            <div className="rounded-3xl bg-accent-soft p-4">
              <p className="text-sm text-slate-700 italic">"Flutter menjembatani kesenjangan antara platform mobile yang berbeda."</p>
            </div>
          </div>
        </div>
      </main>

      <footer className="relative z-10 mt-3 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>

      <button onClick={() => setNotes(!notes)}
        className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
        Catatan Pengajar
      </button>
      {notes && (
        <div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop">
          <h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3>
          <p className="text-[15px] leading-relaxed text-slate-700">Gunakan pertanyaan ini untuk diskusi analytical thinking. Biarkan peserta berprikir tentang dampak nyata dari tidak adanya cross-platform. Tanyakan: "Kalau Anda punya budget terbatas, platform mana yang dipilih dulu?"</p>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
