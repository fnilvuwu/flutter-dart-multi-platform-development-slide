<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
<title>02 Â· perkenalan pemateri</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const certs = [
    'Membuat Aplikasi Flutter', 'Pemrograman dengan Dart',
    'Machine Learning untuk Flutter', 'Prinsip Pemrograman SOLID'
  ];
  const bullets = [
    'Asisten Lab <b>Mobile Development (Android)</b> — mengajar 40+ mahasiswa',
    'Membangun app Android: <b>GymGuide</b> (TensorFlow Lite) & <b>Eye Blink Detector</b>'
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-64 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>

      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Perkenalan</div>
        <h1 className="mt-2 text-6xl font-black leading-tight text-ink">Perkenalan Pemateri</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>

      <main className="relative z-10 mt-8 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-[260px,1fr] gap-10">
          <div className="animate-fade-up">
            <div className="absolute left-24 top-40 h-24 w-24 rounded-full bg-accent/10 animate-float"></div>
            <div className="relative h-[280px] w-[240px] overflow-hidden rounded-2xl border-4 border-accent shadow-xl transition-transform duration-300 hover:-translate-y-1 hover:scale-[1.02]">
              <img src="../foto.jpeg" alt="Rahmatullah R" className="h-full w-full object-cover" />
            </div>
          </div>

          <div>
            <h3 className="text-4xl font-black leading-tight text-ink">Rahmatullah R, S.Kom.</h3>
            <p className="mt-1 text-lg font-semibold text-accent">AI Engineer · Sarjana Ilmu Komputer, Universitas Hasanuddin</p>

            <div className="mt-5 space-y-2.5">
              {bullets.map((b, i) => (
                <div key={i} className="flex items-start gap-3 rounded-xl bg-accent-soft p-3.5 animate-fade-up" style={{ animationDelay: ((i + 2) * 120) + 'ms' }}>
                  <span className="mt-1 h-3.5 w-3.5 flex-none rotate-45 bg-accent"></span>
                  <p className="text-[16px] leading-snug text-slate-700" dangerouslySetInnerHTML={{ __html: b }} />
                </div>
              ))}
            </div>

            <div className="mt-4 animate-fade-up" style={{ animationDelay: '460ms' }}>
              <div className="mb-2 text-sm font-extrabold uppercase tracking-wide text-slate-400">Sertifikat Dicoding</div>
              <div className="flex flex-wrap gap-2">
                {certs.map((c, i) => (
                  <span key={i} className="rounded-full border-2 border-accent bg-white px-4 py-1.5 text-[13px] font-bold text-accent transition-transform duration-300 hover:-translate-y-0.5 hover:scale-105">{c}</span>
                ))}
              </div>
            </div>

            <div className="mt-5 rounded-2xl border-2 border-amber-400 bg-amber-50 p-4 shadow-sm animate-fade-up" style={{ animationDelay: '580ms' }}>
              <div className="mb-2 flex items-center gap-2 text-sm font-extrabold uppercase tracking-wide text-amber-600">
                <span className="text-base">🏆</span> Awards
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="flex items-start gap-2">
                  <span className="text-lg">🥇</span>
                  <p className="text-[15px] font-semibold leading-snug text-slate-700"><b className="text-ink">First Place</b>, OpenTheGate Hackathon 2025</p>
                </div>
                <div className="flex items-start gap-2">
                  <span className="text-lg">🥈</span>
                  <p className="text-[15px] font-semibold leading-snug text-slate-700"><b className="text-ink">Second Place</b>, Makassar Hackathon 2024</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>

      <button onClick={() => setNotes(!notes)}
        className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
        Catatan Pengajar
      </button>
      {notes && (
        <div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop">
          <h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3>
          <p className="text-[15px] leading-relaxed text-slate-700">Kenalkan diri ringkas, lalu hubungkan pengalaman ke topik hari ini: pengalaman asisten lab dan sertifikat Flutter & Dart membuktikan minat di bidang ini. Sorot dua award sebagai penutup kredibilitas. Tanya pemantik: "Ada yang sudah pernah mencoba Flutter sebelumnya?"</p>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
