<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 Â· apa itu flutter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>

      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Definisi</div>
        <h1 className="mt-2 text-6xl font-black leading-tight text-ink">Apa itu Flutter?</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>

      <main className="relative z-10 mt-8 flex-1 px-14" data-stagger>
        <div className="mb-5 flex items-start gap-3 rounded-xl bg-accent-soft p-5 transition-transform hover:scale-[1.01]">
          <div className="flex h-12 w-12 flex-none items-center justify-center rounded-xl bg-accent text-2xl font-extrabold text-white">F</div>
          <div>
            <p className="text-[19px] leading-relaxed text-slate-700">
              <b className="font-bold text-ink">Flutter</b> adalah framework open-source dari <b className="font-bold text-ink">Google</b> untuk membuat aplikasi <b className="font-bold text-accent">multiplatform</b> menggunakan satu codebase.
            </p>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-5 mt-4">
          <div className="rounded-2xl bg-white border-2 border-accent p-5 shadow-sm">
            <h3 className="font-extrabold text-accent text-lg mb-3">Framework</h3>
            <p className="text-[17px] text-slate-700">Kumpulan tools & widget siap pakai untuk membangun UI aplikasi.</p>
          </div>
          <div className="rounded-2xl bg-white border-2 border-[#25D366] p-5 shadow-sm">
            <h3 className="font-extrabold text-[#25D366] text-lg mb-3">Open Source</h3>
            <p className="text-[17px] text-slate-700">Gratis dan bisa dikembangkan oleh siapa saja.</p>
          </div>
        </div>

        <div className="mt-5 rounded-2xl bg-ink p-5 text-white flex items-center gap-4">
          <div className="text-3xl">⚡</div>
          <p className="text-[18px]"><b className="font-bold text-[#25D366]">Satu bahasa (Dart)</b> → bisa membuat aplikasi untuk Android, iOS, Web, dan Desktop.</p>
        </div>
      </main>

      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>

      <button onClick={() => setNotes(!notes)}
        className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
        Catatan Pengajar
      </button>
      {notes && (
        <div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop">
          <h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3>
          <p className="text-[15px] leading-relaxed text-slate-700">Tekankan kata "multiplatform" dan "satu codebase". Jelaskan bahwa Google membuat Flutter untuk menyelesaikan masalah developer yang harus menulis kode berbeda untuk Android dan iOS.</p>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
