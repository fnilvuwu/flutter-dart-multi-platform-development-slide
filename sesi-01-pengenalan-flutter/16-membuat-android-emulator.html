<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
<title>16 · Membuat Android Emulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const steps = [
    { num: '1', title: 'Buka Device Manager', desc: 'Tools → Device Manager di Android Studio' },
    { num: '2', title: 'Klik "Create Device"', desc: 'Pilih tipe perangkat (Pixel, Samsung, dll)' },
    { num: '3', title: 'Pilih sistem', desc: 'Download sistem operasi Android (misal API 33)' },
    { num: '4', title: 'Konfigurasi AVD', desc: 'Atur nama, ukuran layar, RAM, lalu Finish' }
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-16 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Emulator</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">Membuat Android Emulator</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-6 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-4 gap-4">
          {steps.map((s, i) => (
            <div key={i} className="flex flex-col rounded-2xl border-2 border-accent bg-white p-5 shadow-sm transition-transform duration-300 hover:-translate-y-1 hover:scale-[1.02] animate-fade-up" style={{ animationDelay: (i * 120) + 'ms' }}>
              <div className="flex h-10 w-10 items-center justify-center rounded-full bg-accent text-lg font-black text-white">{s.num}</div>
              <h3 className="mt-3 text-[16px] font-black leading-snug text-ink">{s.title}</h3>
              <p className="mt-2 text-[13px] leading-relaxed text-slate-600">{s.desc}</p>
            </div>
          ))}
        </div>
        <div className="mt-5 grid grid-cols-2 gap-5">
          <div className="rounded-xl bg-accent-soft p-5 animate-fade-up" style={{ animationDelay: '500ms' }}>
            <div className="text-[16px] font-bold text-accent mb-3">Tips Memilih Device</div>
            <div className="space-y-2 text-[14px] text-slate-700">
              <div className="flex items-start gap-2"><span className="text-accent font-bold">•</span> Pilih <b className="font-bold text-ink">Pixel 6</b> atau <b className="font-bold text-ink">Pixel 7</b> sebagai device standar</div>
              <div className="flex items-start gap-2"><span className="text-accent font-bold">•</span> Sistem: pilih versi Android terbaru yang sudah didownload</div>
              <div className="flex items-start gap-2"><span className="text-accent font-bold">•</span> Atur RAM minimal <b className="font-bold text-ink">2 GB</b> untuk performa optimal</div>
            </div>
          </div>
          <div className="rounded-xl bg-emerald-50 p-5 animate-fade-up" style={{ animationDelay: '620ms' }}>
            <div className="text-[16px] font-bold text-ink mb-3">Apa itu AVD?</div>
            <div className="text-[14px] text-slate-700 leading-relaxed">
              <b className="font-bold text-ink">Android Virtual Device (AVD)</b> adalah emulator yang meniru perangkat Android fisik. Berguna untuk testing aplikasi tanpa perlu HP fisik.
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Tunjukkan cara membuat AVD di Android Studio. Peserta bisa langsung mencoba membuat emulator sendiri.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<script>(function(){try{if(window.self!==window.top){window.addEventListener('keydown',function(e){if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;var keys=['ArrowRight','ArrowLeft','PageDown','PageUp',' ','Home','End','f','F'];if(keys.indexOf(e.key)===-1)return;e.preventDefault();window.parent.postMessage({type:'deck-nav',key:e.key},'*');});}}catch(err){}})();</script>
</body>
</html>
