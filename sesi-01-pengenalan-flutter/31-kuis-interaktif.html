<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 Â· kuis interaktif</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showKey, setShowKey] = useState([false, false, false]);
  const toggleKey = (i) => setShowKey(showKey.map((v, j) => (j === i ? !v : v)));
  const questions = [
    {
      q: 'Bahasa pemrograman yang digunakan Flutter adalah?',
      options: ['Java', 'Kotlin', 'Dart', 'Swift'],
      answer: 2,
      explanation: 'Flutter menggunakan Dart sebagai bahasa pemrogramannya.'
    },
    {
      q: 'Yang bukan keunggulan Flutter adalah?',
      options: ['Cross-platform', 'Hot Reload', 'Natif performance', 'Widget kaya'],
      answer: 2,
      explanation: 'Flutter memiliki performa hampir natif, bukan natif sepenuhnya.'
    },
    {
      q: 'File utama tempat menulis kode Flutter adalah?',
      options: ['pubspec.yaml', 'lib/main.dart', 'android/app', 'ios/runner'],
      answer: 1,
      explanation: 'lib/main.dart adalah file utama tempat kita menulis kode Flutter.'
    }
  ];
  const [selected, setSelected] = useState([null, null, null]);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute right-80 top-14 w-16 h-16 bg-accent rotate-45 opacity-15 animate-float"></div>

      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Kuis Interaktif</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Uji Pemahaman Anda</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>

      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-3 gap-4">
          {questions.map((q, i) => (
            <div key={i} className="rounded-2xl bg-white p-4 shadow-lg animate-fade-up" style={{animationDelay: (i*120)+'ms'}}>
              <div className="flex items-center gap-2 mb-2">
                <div className="flex h-7 w-7 flex-none items-center justify-center rounded-full bg-accent font-extrabold text-white text-sm">{i+1}</div>
                <p className="font-bold text-ink text-[15px] leading-snug">{q.q}</p>
              </div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                {q.options.map((opt, j) => (
                  <button key={j} onClick={() => {
                    const newSel = [...selected];
                    newSel[i] = j;
                    setSelected(newSel);
                  }}
                    className={`rounded-xl px-2 py-2 text-sm font-medium transition-all active:scale-95 ${
                      selected[i] === j
                        ? (j === q.answer ? 'bg-[#25D366] text-white' : 'bg-[#E32428] text-white')
                        : 'bg-[#F1EEE6] text-slate-700 hover:bg-accent-soft'
                    }`}>
                    {String.fromCharCode(65+j)}. {opt}
                  </button>
                ))}
              </div>
              <button onClick={() => toggleKey(i)}
                className="text-sm font-bold text-accent hover:underline">
                {showKey[i] ? 'Sembunyikan Kunci' : 'Lihat Kunci'}
              </button>
              <div className="min-h-[76px]">
                {showKey[i] && (
                  <div className="mt-2 rounded-lg border-l-4 border-[#25D366] bg-[#25D366]/10 p-2.5 text-sm text-slate-700 animate-pop">
                    {q.explanation}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      </main>

      <footer className="relative z-10 mt-3 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>

      <button onClick={() => setNotes(!notes)}
        className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
        Catatan Pengajar
      </button>
      {notes && (
        <div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop">
          <h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3>
          <p className="text-[15px] leading-relaxed text-slate-700">Berikan waktu 5 menit untuk kuis. Setelah semua peserta menjawab, bahas kunci jawaban satu per satu. Tekankan poin-poin yang banyak salah.</p>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
