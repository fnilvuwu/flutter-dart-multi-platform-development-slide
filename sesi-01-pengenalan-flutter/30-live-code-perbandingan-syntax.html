<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 Â· live code perbandingan syntax</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
.code-block { font-family: 'Courier New', monospace; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [activeTab, setActiveTab] = useState('flutter');
  const codes = {
    flutter: `// Flutter (Dart)
class MyWidget extends StatelessWidget {
  @override
  Widget build(BuildContext context) {
    return Container(
      padding: EdgeInsets.all(16),
      child: Text(
        'Hello World!',
        style: TextStyle(
          fontSize: 24,
          color: Colors.blue,
        ),
      ),
    );
  }
}`,
    kotlin: `// Kotlin (Android)
class MyActivity : AppCompatActivity() {
  override fun onCreate(savedInstanceState: Bundle?) {
    super.onCreate(savedInstanceState)
    setContentView(R.layout.activity_main)
    val textView = findViewById<TextView>(R.id.textView)
    textView.text = "Hello World!"
    textView.setTextSize(24f)
    textView.setTextColor(Color.BLUE)
  }
}`,
    swift: `// Swift (iOS)
class ViewController: UIViewController {
  override func viewDidLoad() {
    super.viewDidLoad()
    let label = UILabel()
    label.text = "Hello World!"
    label.font = UIFont.systemFont(ofSize: 24)
    label.textColor = UIColor.blue
    view.addSubview(label)
  }
}`
  };
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute right-80 top-14 w-16 h-16 bg-accent rotate-45 opacity-15 animate-float"></div>

      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Live Code</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Perbandingan Syntax</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>

      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-2 mb-3">
          {['flutter','kotlin','swift'].map(tab => (
            <button key={tab} onClick={() => setActiveTab(tab)}
              className={`px-5 py-2 rounded-full text-sm font-bold capitalize transition-all ${activeTab === tab ? 'bg-accent text-white' : 'bg-accent-soft text-accent hover:bg-accent/20'}`}>
              {tab === 'flutter' ? 'Flutter (Dart)' : tab === 'kotlin' ? 'Kotlin (Android)' : 'Swift (iOS)'}
            </button>
          ))}
        </div>

        <div className="rounded-2xl bg-[#1E1E1E] p-4 overflow-x-auto">
          <div className="flex items-center gap-2 mb-2">
            <span className="h-3 w-3 rounded-full bg-red-500"></span>
            <span className="h-3 w-3 rounded-full bg-yellow-500"></span>
            <span className="h-3 w-3 rounded-full bg-green-500"></span>
          </div>
          <pre className="code-block text-[13px] text-green-400 whitespace-pre leading-snug">{codes[activeTab]}</pre>
        </div>

        <div className="mt-3 grid grid-cols-3 gap-3">
          <div className="rounded-xl bg-accent-soft px-3 py-2 text-center">
            <p className="font-bold text-accent text-sm">Flutter</p>
            <p className="text-xs text-slate-600">Satu bahasa, multi platform</p>
          </div>
          <div className="rounded-xl bg-red-50 px-3 py-2 text-center">
            <p className="font-bold text-[#E32428] text-sm">Kotlin</p>
            <p className="text-xs text-slate-600">Spesifik Android</p>
          </div>
          <div className="rounded-xl bg-orange-50 px-3 py-2 text-center">
            <p className="font-bold text-[#FF9800] text-sm">Swift</p>
            <p className="text-xs text-slate-600">Spesifik iOS</p>
          </div>
        </div>
      </main>

      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>

      <button onClick={() => setNotes(!notes)}
        className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
        Catatan Pengajar
      </button>
      {notes && (
        <div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop">
          <h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3>
          <p className="text-[15px] leading-relaxed text-slate-700">Tunjukkan perbandingan kode yang menghasilkan widget teks yang sama. Tekankan bahwa Flutter menggunakan pendekatan deklaratif dengan widget, sementara native menggunakan imperative code.</p>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
