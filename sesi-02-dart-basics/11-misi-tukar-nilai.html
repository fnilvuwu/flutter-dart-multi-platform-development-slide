<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 · misi tukar nilai</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [pick, setPick] = useState(null);
  const options = [
    { code: "teh = kopi;\nkopi = teh;", verdict: "miss", fb: "Baris 1 menimpa teh menjadi Kopi. Baris 2 menyalin Kopi lagi — Teh-nya lenyap!" },
    { code: "kopi = teh;\nteh = kopi;", verdict: "miss", fb: "Kebalikannya: baris 1 membuat kopi menjadi Teh, lalu tersalin lagi. Keduanya Teh!" },
    { code: "// sepertinya mustahil...", verdict: "hold", fb: "Jangan menyerah dulu! Ada satu trik sederhana. Jawabannya terungkap di slide analogi berikutnya." },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Tantangan Kode</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Misi: Tukar Isi Dua Variabel</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6 items-start">
          <div className="flex-1 min-w-0">
            <div className="rounded-xl bg-[#1E1E1E] p-4 mb-3">
              <div className="text-stone-500 text-xs mb-1">Isi awal. Misi: tukar isinya hanya dengan assignment.</div>
              <div className="text-green-400 text-[15px] leading-relaxed">String teh = <span className="text-amber-300">"Teh"</span>;</div>
              <div className="text-green-400 text-[15px] leading-relaxed">String kopi = <span className="text-amber-300">"Kopi"</span>;</div>
              <div className="text-stone-500 text-xs mt-2">Target akhir: teh = Kopi, kopi = Teh</div>
            </div>
            <div className="text-sm font-extrabold text-accent uppercase tracking-wide mb-1.5">Coba salah satu jurus:</div>
            <div className="space-y-2">
              {options.map((o, i) => (
                <button key={i} onClick={() => setPick(i)}
                  className={`w-full text-left rounded-xl border-2 px-4 py-2 transition-all active:scale-[.99] ${pick === i ? "border-accent bg-accent-soft" : "border-stone-200 bg-white hover:border-accent/40"}`}>
                  <span className="mr-2 inline-flex h-6 w-6 items-center justify-center rounded-full bg-stone-200 text-xs font-black text-stone-600">{String.fromCharCode(65 + i)}</span>
                  <code className="text-sm text-green-700 whitespace-pre">{o.code}</code>
                </button>
              ))}
            </div>
            <div className="mt-2 min-h-[48px]">
              {pick !== null && (
                <div className="rounded-xl p-2.5 text-sm font-bold animate-pop bg-amber-50 text-amber-800 border border-amber-300">
                  {options[pick].verdict === "hold" ? "🔜 " : "🔍 "}{options[pick].fb}
                </div>
              )}
            </div>
          </div>
          <div className="w-80 flex-none space-y-3">
            <div className="rounded-2xl bg-amber-50 border-2 border-amber-300 p-4">
              <div className="text-sm font-extrabold text-amber-700 uppercase tracking-wide mb-2">Aturan Main</div>
              <ul className="space-y-1.5 text-sm text-stone-700">
                <li>🚫 Nilai awal tidak boleh diketik ulang</li>
                <li>✅ Hanya boleh memakai assignment</li>
                <li>🎯 Akhir: teh = Kopi, kopi = Teh</li>
              </ul>
            </div>
            <div className="rounded-2xl bg-accent-soft border border-accent/20 p-4 text-sm text-stone-600">
              Dua jurus di atas sama-sama gagal. Perhatikan <strong className="text-accent">ke mana perginya data yang tertimpa</strong> — petunjuknya ada di sana.
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Ajak peserta menelusuri tiap baris di kepala. Kunci diskusi: assignment menimpa dan data lama lenyap. JANGAN bocorkan variabel penampung — biarkan analogi gelas di slide berikut yang mengungkapkannya.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
