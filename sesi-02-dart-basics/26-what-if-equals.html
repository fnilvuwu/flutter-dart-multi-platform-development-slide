<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
tailwind.config = {

    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },

</script>

<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showDemo, setShowDemo] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-red-600">What If</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">What If: = vs == ?</h1>
        <div className="mt-4 h-2 w-24 rounded bg-red-500"></div>
      </header>
      <main className="relative z-10 mt-5 flex-1 px-14" data-stagger>
        <div className="flex gap-8">
          <div className="flex-1">
            <div className="bg-red-50 border-2 border-red-300 rounded-xl p-5 mb-5">
              <p className="text-lg text-stone-700">Kesalahan paling umum pemula: <strong> menggunakan <code className="bg-red-100 px-1 rounded">=</code> (assignment) di dalam <code className="bg-red-100 px-1 rounded">if</code> statement!</strong></p>
            </div>
            <div className="grid grid-cols-2 gap-4 mb-5">
              <div className="rounded-xl border-2 border-green-300 bg-green-50 p-4">
                <div className="text-sm font-bold text-green-700 mb-2">✅ == (Perbandingan)</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-stone-400">// Mengecek kesamaan</div>
                  <div className="text-green-400">if (nama == "Andi") {'{'}</div>
                  <div className="text-green-400 ml-4">print("Halo Andi");</div>
                  <div className="text-green-400">{'}'}</div>
                </div>
                <div className="mt-2 text-xs text-green-700">Mengecek: apakah nama SAMA DENGAN "Andi"?</div>
              </div>
              <div className="rounded-xl border-2 border-red-300 bg-red-50 p-4">
                <div className="text-sm font-bold text-red-700 mb-2">❌ = (Assignment)</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-stone-400">// Error di if statement!</div>
                  <div className="text-red-400">if (nama = "Andi") {'{'}</div>
                  <div className="text-red-400 ml-4">print("Halo Andi");</div>
                  <div className="text-red-400">{'}'}</div>
                </div>
                <div className="mt-2 text-xs text-red-700">Error: "Condition must be bool" — = menghasilkan String, bukan bool!</div>
              </div>
            </div>
            <button onClick={() => setShowDemo(!showDemo)} className="w-full rounded-xl bg-red-600 py-3 text-sm font-bold text-white hover:bg-red-700 transition-all active:scale-[0.98]">
              {showDemo ? 'Tutup Demo' : '🔴 Klik untuk Melihat Konsekuensi'}
            </button>
          </div>
          <div className="w-[420px]">
            {showDemo ? (
              <div className="animate-pop space-y-3">
                <div className="bg-[#1E1E1E] rounded-xl p-5 border-2 border-red-500">
                  <div className="text-red-400 font-mono text-sm">
                    <div className="text-red-300 font-bold mb-2">Error: The operand of 'if' must be a bool expression</div>
                    <div className="text-stone-500">lib/main.dart:5:9</div>
                    <div className="mt-3 border-t border-stone-700 pt-3">
                      <div className="text-red-400">if (nama = "Andi")</div>
                      <div className="text-stone-400">    ^</div>
                      <div className="text-stone-500 mt-1">The assignment operator '=' returns</div>
                      <div className="text-stone-500">the assigned value (a String), but</div>
                      <div className="text-stone-500">'if' requires a bool expression.</div>
                    </div>
                  </div>
                </div>
                <div className="bg-green-50 border border-green-300 rounded-xl p-4 text-sm text-green-800">
                  <strong>Yang benar:</strong> Gunakan <code className="bg-green-100 px-1 rounded">==</code> untuk membandingkan, <code className="bg-green-100 px-1 rounded">=</code> hanya untuk memberi nilai.
                </div>
                <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 text-xs text-amber-800">
                  <strong>Cara aman:</strong> Biasakan menulis <code className="bg-amber-100 px-1 rounded">"Andi" == nama</code> (literal di depan) agar jika lupa salah satu =, error lebih jelas.
                </div>
              </div>
            ) : (
              <div className="bg-stone-100 rounded-xl p-6 border-2 border-dashed border-stone-300">
                <div className="text-center text-stone-400">
                  <div className="text-4xl mb-3">⚡</div>
                  <div className="text-lg font-bold">Tekan tombol untuk demo error!</div>
                </div>
              </div>
            )}
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-4 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Ini error #1 yang paling sering terjadi. Tunjukkan di IDE secara live. Tekankan bahwa di Dart, = di if akan error (tidak seperti C/Java yang bisa). Dart lebih strict.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
