<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 Â· practice string</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showAnswer, setShowAnswer] = useState([false, false]);
  const toggleAnswer = (i) => {
    const next = [...showAnswer];
    next[i] = !next[i];
    setShowAnswer(next);
  };
  const soal = [
    {
      judul: 'Soal 1: Sapa Nama',
      tugas: 'Buat string interpolation untuk menampilkan: "Halo, nama saya Andi!"',
      code: 'String nama = "Andi";\nprint("...");',
      jawaban: 'print("Halo, nama saya $nama!");'
    },
    {
      judul: 'Soal 2: Hitung Umur',
      tugas: 'Tampilkan: "Tahun depan saya berumur 22 tahun" menggunakan ${ekspresi}',
      code: 'int umur = 21;\nprint("...");',
      jawaban: 'print("Tahun depan saya berumur ${umur + 1} tahun");'
    },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Practice · Bagian 1 dari 2</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Latihan: String Interpolation (1–2)</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-4">
          {soal.map((s, i) => (
            <div key={i} className="rounded-xl border-2 border-stone-200 bg-white p-3 hover:border-accent/40 transition-all">
              <div className="flex items-center gap-2 mb-1.5">
                <div className="w-8 h-8 flex-none rounded-lg bg-accent text-white flex items-center justify-center font-black text-sm">{i + 1}</div>
                <div className="text-sm font-extrabold text-accent uppercase tracking-wide">{s.judul}</div>
              </div>
              <p className="text-stone-700 text-sm leading-snug mb-1.5">{s.tugas}</p>
              <div className="bg-[#1E1E1E] rounded-lg p-2.5 text-sm mb-1.5">
                <code className="text-green-400 whitespace-pre">{s.code}</code>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={() => toggleAnswer(i)} className="text-xs font-bold text-accent hover:text-accent-strong transition underline underline-offset-2">
                  {showAnswer[i] ? 'Sembunyikan Jawaban' : 'Tampilkan Jawaban'}
                </button>
              </div>
              {showAnswer[i] && (
                <div className="mt-2 bg-[#1E1E1E] rounded-lg p-2.5 animate-pop">
                  <div className="text-stone-500 text-xs mb-1">Jawaban:</div>
                  <code className="text-green-400 text-sm">{s.jawaban}</code>
                </div>
              )}
            </div>
          ))}
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Latihan ini memperkuat pemahaman interpolasi. Berikan waktu 5 menit. Siswa bisa mengerjakan di VS Code secara langsung. Review jawaban bersama.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
