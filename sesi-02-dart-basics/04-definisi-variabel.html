<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 Â· definisi variabel</title>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const tipes = [
    { nama: 'String', contoh: '"Halo Dunia"', warna: 'bg-emerald-100 border-emerald-400 text-emerald-800', desc: 'Teks / kalimat' },
    { nama: 'int', contoh: '42', warna: 'bg-blue-100 border-blue-400 text-blue-800', desc: 'Bilangan bulat' },
    { nama: 'double', contoh: '3.14', warna: 'bg-purple-100 border-purple-400 text-purple-800', desc: 'Bilangan desimal' },
    { nama: 'bool', contoh: 'true / false', warna: 'bg-amber-100 border-amber-400 text-amber-800', desc: 'Benar atau Salah' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Definisi</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Variabel & Tipe Data</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-6">
          <div>
            <div className="text-sm font-bold text-stone-500 uppercase tracking-wide mb-2">Apa itu Variabel?</div>
            <div className="bg-accent/5 rounded-xl p-4 border border-accent/15 mb-3">
              <p className="text-sm text-stone-700 leading-relaxed"><strong className="text-accent">Variabel</strong> adalah nama yang diberikan untuk menyimpan suatu nilai di dalam memori. Setiap variabel memiliki <strong>tipe data</strong> yang menentukan jenis nilai yang bisa disimpan.</p>
              <div className="bg-[#1E1E1E] rounded-lg p-3 mt-2 text-sm">
                <div className="text-stone-400">// Cara deklarasi di Dart</div>
                <div className="text-green-400">TipeData namaVariabel = nilai;</div>
              </div>
            </div>
            <div className="text-sm font-bold text-stone-500 uppercase tracking-wide mb-2">Kombinasi</div>
            <div className="bg-[#1E1E1E] rounded-xl p-3 text-sm">
              <div className="text-green-400">String nama = <span className="text-amber-300">"Andi"</span>;</div>
              <div className="text-green-400">int umur = <span className="text-purple-300">20</span>;</div>
              <div className="text-green-400">double ipk = <span className="text-purple-300">3.75</span>;</div>
              <div className="text-green-400">bool lulus = <span className="text-amber-300">true</span>;</div>
            </div>
          </div>
          <div>
            <div className="text-sm font-bold text-stone-500 uppercase tracking-wide mb-2">4 Tipe Data Dasar</div>
            <div className="space-y-2">
              {tipes.map((t, i) => (
                <div key={i} className={`rounded-xl border-2 ${t.warna} px-4 py-2.5 flex items-center gap-4`}>
                  <div className="w-24 flex-none text-center">
                    <div className="text-base font-black">{t.nama}</div>
                    <div className="text-xs opacity-75">{t.desc}</div>
                  </div>
                  <div className="h-10 w-px bg-current opacity-20"></div>
                  <div className="flex-1 bg-[#1E1E1E] rounded-lg px-3 py-1.5">
                    <span className="text-green-400 text-sm font-mono">{t.contoh}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-3 bg-amber-50 border border-amber-300 rounded-xl p-3 text-sm text-amber-800">
              <strong>Penting:</strong> Di Dart, semua tipe data adalah <strong>object</strong>. Tidak ada tipe primitif seperti di Java/C++.
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Tekankan 4 tipe dasar: String, int, double, bool. Jelaskan bahwa Dart menggunakan type inference (var/const) tapi lebih baik eksplisit untuk pemula. Contoh: var x = 5; otomatis int.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
