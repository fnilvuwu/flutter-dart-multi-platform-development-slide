<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19 · live code logika</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [step, setStep] = useState(0);
  const steps = [
    { label: 'Variabel', code: 'int umur = 20;\nbool mahasiswa = true;\ndouble ipk = 3.5;', out: 'Siap untuk perbandingan' },
    { label: 'Perbandingan', code: 'print(umur >= 18);      // true\nprint(umur < 17);       // false\nprint(ipk == 3.5);      // true', out: 'true\nfalse\ntrue' },
    { label: 'AND (&&)', code: 'print(umur >= 18 && mahasiswa);', out: 'true\n(umur 20 ≥ 18 DAN mahasiswa true)' },
    { label: 'OR (||)', code: 'print(ipk > 3.0 || umur < 18);', out: 'true\n(ipk 3.5 > 3.0 — cukup true)' },
    { label: 'NOT (!)', code: 'print(!mahasiswa);    // false\nprint(!(umur < 17)); // true', out: 'false\ntrue' },
    { label: 'Kombinasi', code: 'bool lulus = umur >= 18 && mahasiswa && ipk >= 3.0;\nprint(lulus);', out: 'true' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Live Code</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Operator Perbandingan & Logika</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6">
          <div className="flex-1 min-w-0">
            <div className="grid grid-cols-6 gap-1 mb-3">
              {steps.map((s, i) => (
                <button key={i} onClick={() => setStep(i)} className={`rounded-lg px-2 py-1.5 text-xs font-bold transition-all ${step === i ? 'bg-accent text-white shadow-md scale-105' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>
                  {s.label}
                </button>
              ))}
            </div>
            <div className="bg-[#1E1E1E] rounded-xl p-4 text-sm leading-snug">
              <div className="text-stone-500 text-xs mb-1">{'// Variabel demo'}</div>
              <div className="text-green-400">int umur = <span className="text-purple-300">20</span>;  bool mahasiswa = <span className="text-purple-300">true</span>;  double ipk = <span className="text-purple-300">3.5</span>;</div>
              <div className="mt-2 border-t border-stone-700 pt-2">
                <div className="text-cyan-300 font-bold whitespace-pre">{steps[step].code}</div>
                <div className="text-stone-600 text-xs mt-1">Step {step + 1} dari {steps.length} — klik tab di atas untuk operator lain</div>
              </div>
              <div className="mt-2 border-t border-stone-700 pt-2">
                <div className="text-stone-500 text-xs mb-1">{'// Output:'}</div>
                <div className="text-cyan-300 font-mono bg-stone-800 rounded px-3 py-1.5 whitespace-pre">{steps[step].out}</div>
              </div>
            </div>
          </div>
          <div className="w-72 flex-none space-y-3">
            <div className="rounded-xl bg-accent/5 border border-accent/15 p-4">
              <div className="text-sm font-bold text-accent uppercase tracking-wide mb-2">Step {step + 1} dari {steps.length}</div>
              <p className="text-stone-700 text-sm leading-relaxed">
                {step === 0 && 'Deklarasikan variabel dengan tipe data yang sesuai. Boolean hasil dari perbandingan.'}
                {step === 1 && 'Operator perbandingan menghasilkan boolean (true/false). Gunakan == untuk kesamaan, bukan =.'}
                {step === 2 && 'AND (&&): Kedua sisi harus true untuk menghasilkan true.'}
                {step === 3 && 'OR (||): Cukup satu sisi true untuk menghasilkan true.'}
                {step === 4 && 'NOT (!): Membalik nilai boolean. true menjadi false, sebaliknya.'}
                {step === 5 && 'Gabungkan operator untuk kondisi kompleks. Baca dari kiri ke kanan dengan urutan operator.'}
              </p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="flex-1 rounded-lg bg-stone-200 py-2 text-sm font-bold text-stone-600 disabled:opacity-40 hover:bg-stone-300 transition">← Prev</button>
              <button onClick={() => setStep(Math.min(steps.length - 1, step + 1))} disabled={step === steps.length - 1} className="flex-1 rounded-lg bg-accent py-2 text-sm font-bold text-white disabled:opacity-40 hover:bg-accent-strong transition">Next →</button>
            </div>
            <div className="bg-amber-50 border border-amber-300 rounded-xl p-3 text-xs text-amber-800">
              <strong>Penting:</strong> Operator logika akan banyak digunakan di <code className="bg-amber-100 px-1 rounded">if/else</code> statement di slide berikutnya!
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Live coding boolean conditions. Demo di IDE. Tunjukkan truth table secara visual. Contoh nyata: validasi form (nama tidak kosong && email mengandung @).</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
