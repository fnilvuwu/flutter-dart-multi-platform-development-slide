<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 · konsep operator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [sel, setSel] = useState(0);
  const operators = [
    { op: '+', nama: 'Penjumlahan', contoh: '10 + 5', hasil: '15', warna: 'bg-blue-50 border-blue-300' },
    { op: '-', nama: 'Pengurangan', contoh: '10 - 5', hasil: '5', warna: 'bg-red-50 border-red-300' },
    { op: '*', nama: 'Perkalian', contoh: '10 * 5', hasil: '50', warna: 'bg-purple-50 border-purple-300' },
    { op: '/', nama: 'Pembagian', contoh: '13 / 22', hasil: '3.333...', warna: 'bg-amber-50 border-amber-300' },
    { op: '%', nama: 'Modulus (sisa)', contoh: '10 % 3', hasil: '1', warna: 'bg-green-50 border-green-300' },
    { op: '~/', nama: 'Pembagian Bulat', contoh: '10 ~/ 3', hasil: '3', warna: 'bg-cyan-50 border-cyan-300' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Konsep</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Operator Aritmatika</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-3 gap-2 mb-3">
          {operators.map((o, i) => (
            <button key={i} onClick={() => setSel(i)}
              className={`rounded-xl border-2 ${o.warna} px-3 py-2.5 flex flex-col items-center text-center transition-all active:scale-95 ${sel === i ? 'ring-2 ring-accent ring-offset-2 shadow-lg scale-[1.02]' : 'hover:shadow-md'}`}>
              <div className="text-2xl font-black text-ink leading-none">{o.op}</div>
              <div className="text-xs font-bold text-stone-600 my-1">{o.nama}</div>
              <div className="bg-[#1E1E1E] rounded-lg px-2 py-1 text-xs w-full whitespace-nowrap overflow-hidden">
                <span className="text-green-400">{o.contoh}</span>
                <span className="text-stone-500"> = </span>
                <span className="text-cyan-300 font-bold">{o.hasil}</span>
              </div>
            </button>
          ))}
        </div>
        <div className="flex gap-3">
          <div className="flex-1 min-w-0 bg-[#1E1E1E] rounded-xl p-4 text-xs leading-relaxed">
            <div className="text-stone-500 mb-1">{'// Coba operator terpilih (' + operators[sel].nama + ')'}</div>
            <div className="text-green-400">int a = <span className="text-purple-300">17</span>;  int b = <span className="text-purple-300">5</span>;</div>
            <div className="text-cyan-300 font-bold mt-1">print({operators[sel].contoh});</div>
            <div className="text-stone-600 text-xs mt-1">Klik kartu operator di atas untuk mengganti contoh dan output</div>
          </div>
          <div className="w-64 flex-none bg-stone-900 rounded-xl p-4 text-xs">
            <div className="text-stone-400 mb-1">{'// Output ' + operators[sel].nama + ':'}</div>
            <div className="text-cyan-300 font-mono text-2xl font-black">→ {operators[sel].hasil}</div>
            <div className="text-stone-500 mt-1">{operators[sel].contoh} = {operators[sel].hasil}</div>
          </div>
        </div>
        <div className="mt-2 grid grid-cols-2 gap-3">
          <div className="bg-amber-50 border border-amber-300 rounded-xl px-3 py-2 text-xs text-amber-800">
            <strong>Perhatian:</strong> <code className="bg-amber-100 px-1 rounded">13 / 22</code> menghasilkan <code className="bg-amber-100 px-1 rounded">3.333</code> (double), bukan 3.
          </div>
          <div className="bg-accent/5 border border-accent/15 rounded-xl px-3 py-2 text-xs text-stone-600">
            <strong>Tips:</strong> Gunakan <code className="bg-accent/10 px-1 rounded text-accent">~/</code> jika ingin hasil pembagian bulat tanpa desimal.
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Tekankan perbedaan / vs ~/, modulus (%) untuk menentukan genap/ganjil, dan urutan operasi (PEMDAS). Operator ~/ khas Dart, tidak ada di banyak bahasa lain.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
