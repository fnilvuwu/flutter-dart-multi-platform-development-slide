<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 Â· analogi string interpolation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Analogi</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">String Interpolation = Resep Masak</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6 items-start">
          <div className="flex-1">
            <p className="text-base text-stone-600 leading-relaxed mb-3">Bayangkan kamu sedang <strong>memasak</strong>. Kamu punya berbagai bahan (variabel) yang perlu dicampur menjadi satu hidangan (string).</p>
            <div className="rounded-xl border-2 border-orange-300 bg-orange-50 p-4 mb-3">
              <div className="text-sm font-bold text-orange-700 mb-2">🍳 Resep: "Halo, nama saya [nama], umur saya [umur] tahun!"</div>
              <div className="flex items-center gap-3 mb-2">
                <div className="w-12 h-12 rounded-xl bg-amber-200 border-2 border-amber-400 flex items-center justify-center text-lg font-bold text-amber-800">N</div>
                <div className="text-stone-500 text-base">+ nama "Andi"</div>
              </div>
              <div className="flex items-center gap-3 mb-2">
                <div className="w-12 h-12 rounded-xl bg-purple-200 border-2 border-purple-400 flex items-center justify-center text-lg font-bold text-purple-800">U</div>
                <div className="text-stone-500 text-base">+ umur 21</div>
              </div>
              <div className="text-center text-xl text-stone-400 my-1">⬇️</div>
              <div className="bg-[#1E1E1E] rounded-lg p-3 text-green-400 text-sm">
                "Halo, nama saya <span className="text-amber-300">$nama</span>, umur saya <span className="text-amber-300">$umur</span> tahun!"
              </div>
              <div className="mt-3 bg-green-100 rounded-lg p-3 text-green-800 text-sm font-bold">
                → "Halo, nama saya Andi, umur saya 21 tahun!"
              </div>
            </div>
          </div>
          <div className="w-72 space-y-3">
            <div className="bg-accent/5 rounded-2xl p-4 border border-accent/20">
              <div className="text-sm font-extrabold text-accent uppercase tracking-wide mb-3">Cara di Dart</div>
              <div className="bg-[#1E1E1E] rounded-lg p-4 text-sm leading-relaxed">
                <div className="text-stone-400">// Cara 1: Sederhana</div>
                <div className="text-green-400">"Halo <span className="text-amber-300">$nama</span>"</div>
                <div className="text-stone-400 mt-2">// Cara 2: Ekspresi</div>
                <div className="text-green-400">"Umur: <span className="text-amber-300">${'{umur + 1}'}</span>"</div>
                <div className="text-stone-400 mt-2">// Catatan:</div>
                <div className="text-stone-400">$variable → nama variabel</div>
                <div className="text-stone-400">${'{expression}'} → ekspresi</div>
              </div>
            </div>
            <div className="bg-green-50 border border-green-300 rounded-xl p-4 text-sm text-green-800">
              <strong>Kelebihan:</strong> String interpolation lebih rapi dan mudah dibaca daripada concatenation (<code className="bg-green-100 px-1 rounded">"Halo " + nama</code>).
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-2 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Analogi resep masak sangat membantu. Tekankan bahwa $ hanya untuk variabel sederhana, sedangkan ${'{expression}'} untuk operasi/aritmatika. Jangan lupa gunakan tanda kutip ganda!</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
