<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 · analogi variabel</title>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [step, setStep] = useState(0);
  const steps = [
    { title: 'Langkah 1 — Semua ada di tempatnya', card: 'border-amber-300 bg-amber-50', titleColor: 'text-amber-700',
      glasses: [{ label: 'Teh', drink: 'amber' }, { label: 'Kosong', drink: null }, { label: 'Kopi', drink: 'dark' }], arrows: ['→', '→'] },
    { title: 'Langkah 2 — Pindahkan ke gelas kosong', card: 'border-blue-300 bg-blue-50', titleColor: 'text-blue-700',
      glasses: [{ label: 'Teh', drink: null }, { label: 'Kosong', drink: 'amber' }, { label: 'Kopi', drink: 'dark' }], arrows: ['→', '→'] },
    { title: 'Langkah 3 — Tukar posisi, selesai!', card: 'border-green-300 bg-green-50', titleColor: 'text-green-700',
      glasses: [{ label: 'Kopi', drink: 'dark' }, { label: 'Teh', drink: 'amber' }], arrows: ['←'] },
  ];
  const frame = (d) => d === 'amber' ? 'bg-amber-200 border-amber-400' : d === 'dark' ? 'bg-stone-800 border-stone-600' : 'bg-stone-200 border-stone-400';
  const labelColor = (d, label) => d === 'dark' ? 'text-stone-200' : (label === 'Kosong' && !d ? 'text-stone-600' : 'text-amber-800');
  const drinkColor = (d) => d === 'amber' ? 'bg-amber-500' : 'bg-stone-900';
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Analogi</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Variabel = Gelas & Label</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-3 flex-1 px-14" data-stagger>
        <div className="flex gap-6 items-start">
          <div className="flex-1 min-w-0">
            <p className="text-base text-stone-600 leading-relaxed mb-3">Bayangkan kamu punya <strong>gelas teh</strong> dan <strong>gelas kopi</strong>. Mau tukar isinya? Kamu butuh <strong>gelas kosong</strong> sebagai penampung sementara — persis seperti <strong>variabel</strong> di kode!</p>
            <div className="flex gap-2 mb-3">
              {steps.map((s, i) => (
                <button key={i} onClick={() => setStep(i)}
                  className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all active:scale-95 ${step === i ? 'bg-accent text-white shadow-md' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>
                  Langkah {i + 1}
                </button>
              ))}
            </div>
            <div className={`rounded-xl border-2 p-4 ${steps[step].card}`}>
              <div className={`text-sm font-bold mb-2 ${steps[step].titleColor}`}>{steps[step].title}</div>
              <div className="flex gap-3 items-center">
                {steps[step].glasses.map((g, gi) => (
                  <div key={gi} className="flex items-center gap-3">
                    {gi > 0 && <div className="text-2xl text-stone-400">{steps[step].arrows[gi - 1]}</div>}
                    <div className={`w-20 h-24 rounded-lg border-2 flex flex-col items-center justify-center ${frame(g.drink)}`}>
                      <span className={`text-xs font-bold ${labelColor(g.drink, g.label)}`}>{g.label}</span>
                      {g.drink && <div className={`w-12 h-8 rounded mt-1 ${drinkColor(g.drink)}`}></div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="w-80 flex-none bg-accent/5 rounded-2xl p-4 border border-accent/20">
            <div className="text-sm font-extrabold text-accent uppercase tracking-wide mb-2">Koneksi ke Kode</div>
            <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm leading-relaxed">
              <div className="text-stone-400">// Gelas = Variabel</div>
              <div className="text-green-400">String teh = <span className="text-amber-300">"Teh"</span>;</div>
              <div className="text-green-400">String kopi = <span className="text-amber-300">"Kopi"</span>;</div>
              <div className="text-green-400">String kosong;</div>
              <div className="text-stone-400 mt-2">// Tukar isi</div>
              <div className="text-green-400">kosong = teh;</div>
              <div className="text-green-400">teh = kopi;</div>
              <div className="text-green-400">kopi = kosong;</div>
            </div>
            <p className="mt-3 text-sm text-stone-600">Tanpa gelas kosong (<code className="bg-accent/10 px-1 rounded text-accent">kosong</code>), tukar isi mustahil dilakukan!</p>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-3 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Analogi gelas sangat efektif untuk menjelaskan konsep variabel dan assignment. Tekankan bahwa variabel di Dart harus dideklarasikan dengan tipe data sebelum digunakan. Variabel seperti "label" yang menempel pada "gelas" (memory).</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
