<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 Â· what if urutan operasi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showExplanation, setShowExplanation] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-red-600">What If</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">What If: Tanpa Kurung ()?</h1>
        <div className="mt-4 h-2 w-24 rounded bg-red-500"></div>
      </header>
      <main className="relative z-10 mt-5 flex-1 px-14" data-stagger>
        <div className="flex gap-8">
          <div className="flex-1">
            <div className="bg-red-50 border-2 border-red-300 rounded-xl p-5 mb-5">
              <p className="text-lg text-stone-700">Apa yang terjadi jika kita <strong>tidak menggunakan kurung ()</strong> untuk mengontrol urutan operasi?</p>
            </div>
            <div className="grid grid-cols-2 gap-4 mb-5">
              <div className="rounded-xl border-2 border-green-300 bg-green-50 p-4">
                <div className="text-sm font-bold text-green-700 mb-2">✅ Dengan Kurung</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-green-400">int hasil = (2 + 3) * 4;</div>
                  <div className="text-stone-500 mt-1">// (2+3) = 5, lalu 5*4 = 20</div>
                  <div className="text-cyan-300 mt-1 font-bold">{'// hasil = 20 ✓'}</div>
                </div>
              </div>
              <div className="rounded-xl border-2 border-red-300 bg-red-50 p-4">
                <div className="text-sm font-bold text-red-700 mb-2">❌ Tanpa Kurung</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-red-400">int hasil = 2 + 3 * 4;</div>
                  <div className="text-stone-500 mt-1">// 3*4 = 12, lalu 2+12 = 14</div>
                  <div className="text-red-300 mt-1 font-bold">{'// hasil = 14 ✗'}</div>
                </div>
              </div>
            </div>
            <div className="bg-[#1E1E1E] rounded-xl p-5 text-sm">
              <div className="text-stone-400 mb-2">{'// Perbandingan hasil'}</div>
              <div className="text-green-400">print((2 + 3) * 4);  <span className="text-cyan-300">{'// → 20'}</span></div>
              <div className="text-red-400">print(2 + 3 * 4);    <span className="text-cyan-300">{'// → 14'}</span></div>
              <div className="text-green-400">print(10 - 2 * 3);   <span className="text-cyan-300">{'// → 4'}</span></div>
              <div className="text-green-400">print((10 - 2) * 3); <span className="text-cyan-300">{'// → 24'}</span></div>
            </div>
            <button onClick={() => setShowExplanation(!showExplanation)} className="mt-4 w-full rounded-xl bg-red-600 py-3 text-sm font-bold text-white hover:bg-red-700 transition-all active:scale-[0.98]">
              {showExplanation ? 'Tutup Penjelasan' : '📖 Lihat Urutan Prioritas'}
            </button>
          </div>
          <div className="w-80 space-y-3">
            {showExplanation ? (
              <div className="animate-pop bg-white border-2 border-accent rounded-xl p-5">
                <div className="text-sm font-bold text-accent uppercase tracking-wide mb-3">Urutan Prioritas (PEMDAS)</div>
                <div className="space-y-2 text-sm">
                  <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-accent text-white flex items-center justify-center font-bold text-xs">1</div><span className="text-stone-700"><strong>( )</strong> — Kurung</span></div>
                  <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-accent text-white flex items-center justify-center font-bold text-xs">2</div><span className="text-stone-700"><strong>~/ % /</strong> — Bagi</span></div>
                  <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-accent text-white flex items-center justify-center font-bold text-xs">3</div><span className="text-stone-700"><strong>*</strong> — Kali</span></div>
                  <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-accent text-white flex items-center justify-center font-bold text-xs">4</div><span className="text-stone-700"><strong>+ -</strong> — Tambah/Kurang</span></div>
                </div>
                <div className="mt-3 text-xs text-stone-500">Sama seperti matematika: Kurung → Kali/Bagi → Tambah/Kurang</div>
              </div>
            ) : (
              <div className="bg-stone-100 rounded-xl p-6 border-2 border-dashed border-stone-300">
                <div className="text-center text-stone-400">
                  <div className="text-4xl mb-3">🔢</div>
                  <div className="text-lg font-bold">Tekan tombol untuk melihat urutan!</div>
                </div>
              </div>
            )}
            <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 text-xs text-amber-800">
              <strong>Ingat:</strong> PEMDAS — Parentheses, Exponents, Multiply/Divide, Add/Subtract. Sama seperti matematika di sekolah!
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-4 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Banyak bug terjadi karena salah urutan operasi. Tekankan pentingnya kurung. Contoh nyata: perhitungan harga total dengan diskon. Contoh: total = harga * jumlah - diskon vs total = (harga * jumlah) - diskon.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
