<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 Â· konsep operator logika</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const perbandingan = [
    { op: '==', nama: 'Sama Dengan', contoh: '5 == 5', hasil: 'true', warna: 'bg-green-50 border-green-300' },
    { op: '!=', nama: 'Tidak Sama', contoh: '5 != 3', hasil: 'true', warna: 'bg-blue-50 border-blue-300' },
    { op: '<', nama: 'Kurang Dari', contoh: '3 < 7', hasil: 'true', warna: 'bg-purple-50 border-purple-300' },
    { op: '>', nama: 'Lebih Dari', contoh: '10 > 2', hasil: 'true', warna: 'bg-amber-50 border-amber-300' },
    { op: '<=', nama: 'Kurang/Sama', contoh: '5 <= 5', hasil: 'true', warna: 'bg-cyan-50 border-cyan-300' },
    { op: '>=', nama: 'Lebih/Sama', contoh: '8 >= 3', hasil: 'true', warna: 'bg-pink-50 border-pink-300' },
  ];
  const logika = [
    { op: '&&', nama: 'AND', desc: 'Kedua kondisi harus benar', contoh: 'true && false = false', warna: 'bg-indigo-50 border-indigo-300' },
    { op: '||', nama: 'OR', desc: 'Salah satu kondisi cukup', contoh: 'true || false = true', warna: 'bg-orange-50 border-orange-300' },
    { op: '!', nama: 'NOT', desc: 'Membalik nilai boolean', contoh: '!true = false', warna: 'bg-red-50 border-red-300' },
  ];
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-8" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">Konsep</div>
        <h1 className="mt-2 text-4xl font-black leading-tight text-ink">Operator Perbandingan & Logika</h1>
        <div className="mt-3 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-2 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <div className="text-sm font-bold text-stone-500 uppercase tracking-wide mb-1.5">Operator Perbandingan</div>
            <div className="grid grid-cols-2 gap-1.5">
              {perbandingan.map((o, i) => (
                <div key={i} className={`rounded-lg border-2 ${o.warna} px-2.5 py-1.5 flex items-center gap-2`}>
                  <div className="text-lg font-black text-ink w-10 text-center">{o.op}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-xs font-bold text-stone-600 leading-tight">{o.nama}</div>
                    <div className="bg-[#1E1E1E] rounded px-2 py-0.5 text-xs mt-0.5">
                      <span className="text-green-400">{o.contoh}</span>
                      <span className="text-stone-500"> → </span>
                      <span className="text-cyan-300 font-bold">{o.hasil}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="text-sm font-bold text-stone-500 uppercase tracking-wide mb-1.5">Operator Logika</div>
            <div className="space-y-1.5">
              {logika.map((o, i) => (
                <div key={i} className={`rounded-xl border-2 ${o.warna} px-3 py-2`}>
                  <div className="flex items-center gap-3">
                    <div className="text-xl font-black text-ink w-10 flex-none text-center">{o.op}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-bold text-stone-700 leading-tight">{o.nama}</div>
                      <div className="text-xs text-stone-500 leading-tight">{o.desc}</div>
                      <div className="bg-[#1E1E1E] rounded px-2 py-0.5 text-xs mt-0.5">
                        <span className="text-green-400">{o.contoh}</span>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-1.5 bg-[#1E1E1E] rounded-xl px-3 py-2 text-xs">
              <div className="text-stone-400 mb-0.5">{'// Truth Table'}</div>
              <div className="text-green-400 leading-tight">true  && true  = <span className="text-cyan-300">true</span></div>
              <div className="text-green-400 leading-tight">true  && false = <span className="text-cyan-300">false</span></div>
              <div className="text-green-400 leading-tight">false || true  = <span className="text-cyan-300">true</span></div>
              <div className="text-green-400 leading-tight">false || false = <span className="text-cyan-300">false</span></div>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-1.5 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-2 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Perbandingan menghasilkan boolean. Logika (&&, ||) digunakan di if statement. Tekankan: == (sama dengan) vs = (assignment). Ini salah satu error paling umum.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
