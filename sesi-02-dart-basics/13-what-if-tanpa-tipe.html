<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 Â· what if tanpa tipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}@media print {
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .fixed { display: none !important; }
  .relative.mx-auto.my-8 { margin: 0 !important; }
}
</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showError, setShowError] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-red-600">What If</div>
        <h1 className="mt-2 text-5xl font-black leading-tight text-ink">What If: Tanpa Tipe Data?</h1>
        <div className="mt-4 h-2 w-24 rounded bg-red-500"></div>
      </header>
      <main className="relative z-10 mt-5 flex-1 px-14" data-stagger>
        <div className="flex gap-8">
          <div className="flex-1">
            <div className="bg-red-50 border-2 border-red-300 rounded-xl p-5 mb-5">
              <div className="text-sm font-bold text-red-700 uppercase tracking-wide mb-2">⚠️ Pertanyaan</div>
              <p className="text-lg text-stone-700">Apa yang terjadi jika kita <strong>tidak mendeklarasikan tipe data</strong> pada variabel di Dart?</p>
            </div>
            <div className="grid grid-cols-2 gap-4 mb-5">
              <div className="rounded-xl border-2 border-green-300 bg-green-50 p-4">
                <div className="text-sm font-bold text-green-700 mb-2">✅ Benar (Dart)</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-green-400">String nama = <span className="text-amber-300">"Andi"</span>;</div>
                  <div className="text-green-400">int umur = <span className="text-purple-300">21</span>;</div>
                </div>
              </div>
              <div className="rounded-xl border-2 border-red-300 bg-red-50 p-4">
                <div className="text-sm font-bold text-red-700 mb-2">❌ Salah</div>
                <div className="bg-[#1E1E1E] rounded-lg p-3 text-sm">
                  <div className="text-red-400">nama = <span className="text-amber-300">"Andi"</span>; <span className="text-red-300">// Error!</span></div>
                  <div className="text-red-400">umur = <span className="text-purple-300">21</span>; <span className="text-red-300">// Error!</span></div>
                </div>
              </div>
            </div>
            <button onClick={() => setShowError(!showError)} className="w-full rounded-xl bg-red-600 py-3 text-sm font-bold text-white hover:bg-red-700 transition-all active:scale-[0.98]">
              {showError ? 'Tutup Error' : '🔴 Klik untuk Melihat Error'}
            </button>
          </div>
          <div className="w-[440px]">
            {showError ? (
              <div className="animate-pop bg-[#1E1E1E] rounded-xl p-6 border-2 border-red-500">
                <div className="text-red-400 font-mono text-sm leading-relaxed">
                  <div className="text-red-300 font-bold mb-2">Error: The getter 'nama' isn't defined</div>
                  <div className="text-stone-500">lib/main.dart:3:15</div>
                  <div className="mt-3 border-t border-stone-700 pt-3">
                    <div className="text-stone-400">═══════════════════════════════════════</div>
                    <div className="text-red-400 font-bold">Unhandled Exception:</div>
                    <div className="text-stone-400">NoSuchMethodError: The method</div>
                    <div className="text-stone-400">'.' was called on null.</div>
                  </div>
                </div>
                <div className="mt-4 bg-red-500/10 rounded-lg p-3 text-sm text-red-300">
                  <strong>Kenapa?</strong> Dart adalah bahasa <strong>statically typed</strong>. Setiap variabel harus punya tipe data yang jelas agar compiler tahu berapa banyak memory yang dialokasikan.
                </div>
              </div>
            ) : (
              <div className="bg-stone-100 rounded-xl p-6 border-2 border-dashed border-stone-300">
                <div className="text-center text-stone-400">
                  <div className="text-4xl mb-3">🤔</div>
                  <div className="text-lg font-bold">Tekan tombol untuk melihat konsekuensi!</div>
                </div>
              </div>
            )}
            <div className="mt-4 bg-accent/5 border border-accent/15 rounded-xl p-4 text-sm text-stone-600">
              <strong className="text-accent">Catatan:</strong> Dart memaksa tipe data agar tidak ada kebingungan di runtime. Ini membantu menangkap error sejak program dikompilasi, bukan saat dijalankan.
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-4 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Ini penting untuk dipahami: Dart ≠ JavaScript. Dart harus deklarasikan tipe. Tunjukkan error di IDE secara live agar siswa melihat langsung. Variasi: coba hapus tipe dari berbagai tipe data.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
