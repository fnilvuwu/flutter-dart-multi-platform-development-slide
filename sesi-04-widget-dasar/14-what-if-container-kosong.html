<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 · What If: Container Kosong</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showA, setShowA] = useState(false);
  const [showB, setShowB] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">WHAT IF?</div>
        <h1 className="mt-2 text-6xl font-black leading-tight text-ink">Container Tanpa Child?</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-6 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-8">
          <div className="space-y-4">
            <div className="rounded-2xl bg-amber-50 border-2 border-amber-300 p-6">
              <div className="font-bold text-lg text-ink mb-3">🤔 Percobaan</div>
              <p className="text-slate-700">Apa yang terjadi dengan Container yang punya <span className="font-bold">width, height, color</span> tapi <span className="font-bold text-red-600">tanpa child</span>?</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-5 font-mono text-xs leading-relaxed">
              <div className="text-slate-400 mb-2">// Container dengan ukuran tapi kosong</div>
              <div><span className="text-purple-300">Container</span>(</div>
              <div className="pl-4"><span className="text-amber-300">width</span>: <span className="text-green-300">200</span>,</div>
              <div className="pl-4"><span className="text-amber-300">height</span>: <span className="text-green-300">100</span>,</div>
              <div className="pl-4"><span className="text-amber-300">color</span>: <span className="text-purple-300">Colors</span>.<span className="text-green-300">blue</span>,</div>
              <div>)</div>
              <div className="mt-2 text-slate-400">// ❓ Hasil?</div>
            </div>
          </div>
          <div className="space-y-4">
            <button onClick={() => setShowA(!showA)} className="w-full rounded-xl bg-accent px-6 py-3 text-lg font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
              {showA ? 'Sembunyikan' : 'Lihat Hasil A'}
            </button>
            {showA && (
              <div className="animate-pop rounded-xl bg-green-50 border-2 border-green-200 p-5">
                <div className="font-bold text-green-700 mb-2">✅ Hasil: Kotak Biru Muncul!</div>
                <p className="text-slate-700">Container dengan width, height, dan color tetap <span className="font-bold">terlihat</span> meski tanpa child — karena ukuran dan warna sudah didefinisikan.</p>
                <div className="mt-4 flex justify-center">
                  <div className="w-48 h-24 bg-blue-500 rounded-lg"></div>
                </div>
              </div>
            )}
            <button onClick={() => setShowB(!showB)} className="w-full rounded-xl bg-red-500 px-6 py-3 text-lg font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
              {showB ? 'Sembunyikan' : 'Lihat Hasil B'}
            </button>
            {showB && (
              <div className="animate-pop rounded-xl bg-red-50 border-2 border-red-200 p-5">
                <div className="font-bold text-red-700 mb-2">⚠️ Tanpa Width/Height = Tidak Terlihat!</div>
                <p className="text-slate-700">Jika tidak ada width, height, <span className="font-bold">atau</span> child, Container collapse dan tidak terlihat.</p>
                <div className="mt-4 text-center text-slate-400 text-sm">[ Container kosong = tidak terlihat ]</div>
              </div>
            )}
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Container kosong dengan color tetap terlihat. Tapi tanpa width/height/child, ia collapse. Ini penting untuk debugging layout.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
