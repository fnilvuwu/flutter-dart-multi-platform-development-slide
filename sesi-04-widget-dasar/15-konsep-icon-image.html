<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 · Konsep Icon & Image</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">KONSEP</div>
        <h1 className="mt-2 text-6xl font-black leading-tight text-ink">Icon & Image</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-6 flex-1 px-14" data-stagger>
        <div className="grid grid-cols-2 gap-8">
          <div className="rounded-2xl border-2 border-purple-200 bg-purple-50 p-6">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-14 h-14 rounded-xl bg-purple-500 flex items-center justify-center text-3xl text-white">⭐</div>
              <div>
                <div className="font-bold text-2xl text-purple-800">Icon Widget</div>
                <div className="text-sm text-purple-600">Ikon vector bawaan Material</div>
              </div>
            </div>
            <ul className="space-y-2 text-slate-700 text-sm">
              <li className="flex items-start gap-2"><span className="text-purple-500 font-bold">✓</span> Ribuan ikon gratis (Icons class)</li>
              <li className="flex items-start gap-2"><span className="text-purple-500 font-bold">✓</span> Bisa atur size & color</li>
              <li className="flex items-start gap-2"><span className="text-purple-500 font-bold">✓</span> Vektor — tidak pecah saat di-zoom</li>
            </ul>
            <div className="mt-4 bg-slate-800 rounded-lg p-3 font-mono text-xs">
              <span className="text-purple-300">Icon</span>(<span className="text-purple-300">Icons</span>.<span className="text-green-300">star</span>, <span className="text-amber-300">size</span>: <span className="text-green-300">32</span>, <span className="text-amber-300">color</span>: <span className="text-purple-300">Colors</span>.<span className="text-green-300">amber</span>)</div>
          </div>
          <div className="rounded-2xl border-2 border-green-200 bg-green-50 p-6">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-14 h-14 rounded-xl bg-green-500 flex items-center justify-center text-3xl text-white">🖼️</div>
              <div>
                <div className="font-bold text-2xl text-green-800">Image Widget</div>
                <div className="text-sm text-green-600">Tampilkan gambar dari berbagai sumber</div>
              </div>
            </div>
            <ul className="space-y-2 text-slate-700 text-sm">
              <li className="flex items-start gap-2"><span className="text-green-500 font-bold">✓</span> Image.asset — gambar lokal</li>
              <li className="flex items-start gap-2"><span className="text-green-500 font-bold">✓</span> Image.network — gambar online</li>
              <li className="flex items-start gap-2"><span className="text-green-500 font-bold">✓</span> BoxFit — atur cara gambar fitting</li>
            </ul>
            <div className="mt-4 bg-slate-800 rounded-lg p-3 font-mono text-xs">
              <span className="text-purple-300">Image</span>.<span className="text-purple-300">asset</span>(<span className="text-orange-300">'assets/logo.png'</span>, <span className="text-amber-300">width</span>: <span className="text-green-300">100</span>)</div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Icon untuk UI elements (tombol, navigasi). Image untuk foto/gambar. Jangan lupa daftarkan asset di pubspec.yaml untuk Image.asset.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
