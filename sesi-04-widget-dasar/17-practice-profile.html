<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 · Practice: Profile Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { accent: '#E32428', 'accent-soft': '#FBE8E8', 'accent-strong': '#C1121F', paper: '#FFFFFF', ink: '#1F1F1F' },
    animation: { 'fade-up': 'fade-up .8s cubic-bezier(.22,.61,.36,1) both', 'pop': 'pop .5s ease-out both', 'float': 'floaty 6s ease-in-out infinite', 'spin-slower': 'spin-slow 18s linear infinite' }
  }}
};
</script>
<style>
@keyframes fade-up { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
@keyframes pop { 0% { transform:scale(.8); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
@keyframes spin-slow { to { transform:rotate(360deg); } }
[data-stagger] > * { opacity:0; animation:fade-up .8s ease-out forwards; }
[data-stagger] > *:nth-child(1){ animation-delay:.10s; }
[data-stagger] > *:nth-child(2){ animation-delay:.22s; }
[data-stagger] > *:nth-child(3){ animation-delay:.34s; }
[data-stagger] > *:nth-child(4){ animation-delay:.46s; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('presenter');</script>
<style>html.presenter body{margin:0!important}html.presenter .relative.mx-auto.my-8{margin:0!important}html.presenter .fixed.right-6{display:none!important}</style>
</head>
<body class="bg-[#3A3F44]">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function Slide() {
  const [notes, setNotes] = useState(false);
  const [showAnswer, setShowAnswer] = useState(false);
  return (
    <div className="relative mx-auto my-8 w-[1280px] h-[720px] overflow-hidden bg-paper shadow-2xl flex flex-col">
      <div className="absolute -right-10 -top-10 w-56 h-56 rounded-full border-[22px] border-accent/90 animate-spin-slower"></div>
      <div className="absolute left-72 top-20 w-14 h-14 bg-accent rotate-45 opacity-15 animate-float"></div>
      <header className="relative z-10 px-14 pt-12" data-stagger>
        <img src="../assets/screenesia-logo.png" alt="Screenesia" className="absolute top-6 right-8 z-20 h-9 w-auto pointer-events-none" />
        <div className="text-sm font-extrabold tracking-[2.5px] uppercase text-accent">PRAKTIK</div>
        <h1 className="mt-2 text-6xl font-black leading-tight text-ink">Profile Card</h1>
        <div className="mt-4 h-2 w-24 rounded bg-accent"></div>
      </header>
      <main className="relative z-10 mt-6 flex-1 px-14" data-stagger>
        <div className="flex gap-8 items-start">
          <div className="flex-1 space-y-4">
            <div className="rounded-2xl bg-amber-50 border-2 border-amber-300 p-6">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center text-white font-bold">📝</div>
                <div className="font-bold text-xl text-ink">Tugas: Profile Card</div>
              </div>
              <p className="text-lg text-slate-700 mb-3">Buat profile card dengan:</p>
              <ul className="space-y-2 text-slate-600 pl-6">
                <li>• Container dengan decoration & shadow</li>
                <li>• Avatar (icon person besar)</li>
                <li>• Nama & email</li>
                <li>• Tombol "Follow"</li>
              </ul>
            </div>
            <button onClick={() => setShowAnswer(!showAnswer)} className="rounded-lg bg-accent px-6 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
              {showAnswer ? 'Tutup' : 'Lihat Jawaban'}
            </button>
            {showAnswer && (
              <div className="bg-slate-800 rounded-xl p-4 font-mono text-xs leading-relaxed animate-pop max-h-[300px] overflow-y-auto">
                <div className="text-slate-400 text-xs mb-2">// profile_card.dart</div>
                <div><span className="text-purple-300">Container</span>(</div>
                <div className="pl-4"><span className="text-amber-300">padding</span>: <span className="text-purple-300">EdgeInsets</span>.<span className="text-purple-300">all</span>(<span className="text-green-300">20</span>),</div>
                <div className="pl-4"><span className="text-amber-300">decoration</span>: <span className="text-purple-300">BoxDecoration</span>(</div>
                <div className="pl-8"><span className="text-amber-300">color</span>: <span className="text-purple-300">Colors</span>.<span className="text-green-300">white</span>,</div>
                <div className="pl-8"><span className="text-amber-300">borderRadius</span>: <span className="text-purple-300">BorderRadius</span>.<span className="text-purple-300">circular</span>(<span className="text-green-300">16</span>),</div>
                <div className="pl-8"><span className="text-amber-300">boxShadow</span>: [<span className="text-purple-300">BoxShadow</span>(<span className="text-amber-300">blurRadius</span>: <span className="text-green-300">10</span>, <span className="text-amber-300">color</span>: <span className="text-purple-300">Colors</span>.<span className="text-green-300">grey</span>.<span className="text-purple-300">withOpacity</span>(<span className="text-green-300">0.2</span>))]</div>
                <div className="pl-4">),</div>
                <div className="pl-4"><span className="text-amber-300">child</span>: <span className="text-purple-300">Column</span>(</div>
                <div className="pl-8"><span className="text-amber-300">children</span>: [</div>
                <div className="pl-12"><span className="text-purple-300">CircleAvatar</span>(<span className="text-amber-300">radius</span>: <span className="text-green-300">40</span>, <span className="text-amber-300">child</span>: <span className="text-purple-300">Icon</span>(<span className="text-purple-300">Icons</span>.<span className="text-green-300">person</span>, <span className="text-amber-300">size</span>: <span className="text-green-300">40</span>)),</div>
                <div className="pl-12"><span className="text-purple-300">SizedBox</span>(<span className="text-amber-300">height</span>: <span className="text-green-300">12</span>),</div>
                <div className="pl-12"><span className="text-purple-300">Text</span>(<span className="text-orange-300">'John Doe'</span>, <span className="text-amber-300">style</span>: <span className="text-purple-300">TextStyle</span>(<span className="text-amber-300">fontSize</span>: <span className="text-green-300">22</span>, <span className="text-amber-300">fontWeight</span>: <span className="text-purple-300">FontWeight</span>.<span className="text-green-300">bold</span>)),</div>
                <div className="pl-12"><span className="text-purple-300">Text</span>(<span className="text-orange-300">'john@email.com'</span>, <span className="text-amber-300">style</span>: <span className="text-purple-300">TextStyle</span>(<span className="text-amber-300">color</span>: <span className="text-purple-300">Colors</span>.<span className="text-green-300">grey</span>)),</div>
                <div className="pl-12"><span className="text-purple-300">SizedBox</span>(<span className="text-amber-300">height</span>: <span className="text-green-300">16</span>),</div>
                <div className="pl-12"><span className="text-purple-300">ElevatedButton</span>(<span className="text-amber-300">onPressed</span>: (){}, <span className="text-amber-300">child</span>: <span className="text-purple-300">Text</span>(<span className="text-orange-300">'Follow'</span>))</div>
                <div className="pl-8">]</div>
                <div className="pl-4">)</div>
                <div>)</div>
              </div>
            )}
          </div>
          <div className="w-[340px]">
            <div className="rounded-xl bg-accent-soft p-4">
              <div className="text-sm text-accent font-bold mb-3">PREVIEW:</div>
              <div className="bg-white rounded-2xl p-6 shadow-lg text-center">
                <div className="w-20 h-20 rounded-full bg-accent/10 flex items-center justify-center mx-auto">
                  <div className="text-4xl text-accent">👤</div>
                </div>
                <div className="mt-4 text-xl font-bold text-ink">John Doe</div>
                <div className="text-sm text-slate-400">john@email.com</div>
                <button className="mt-4 rounded-full bg-accent px-8 py-2 text-white font-bold text-sm">Follow</button>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer className="relative z-10 mt-6 flex items-center justify-between border-t border-stone-300 px-14 pb-7 pt-3 text-sm text-accent">
        <span>#UpgradeYourSkillNow</span>
        <span>www.screenesia.com</span>
      </footer>
      <button onClick={() => setNotes(!notes)} className="fixed right-6 bottom-6 z-50 rounded-full bg-accent px-5 py-2.5 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105 active:scale-95">Catatan Pengajar</button>
      {notes && (<div className="fixed left-6 bottom-6 z-40 w-[460px] rounded-xl border-2 border-accent bg-white p-5 shadow-2xl animate-pop"><h3 className="mb-1 text-sm font-extrabold uppercase tracking-wide text-accent">Catatan Pengajar</h3><p className="text-[15px] leading-relaxed text-slate-700">Tugas ini menggabungkan Container, Column, Text, Icon, dan ElevatedButton. Siswa berlatih menyusun widget secara hierarki.</p></div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<!-- deck-nav forwarder (presenter) -->
<script>
(function () {
  try {
    if (window.self !== window.top) {
      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var keys = ['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' ', 'Home', 'End', 'f', 'F'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'deck-nav', key: e.key }, '*');
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
